; ============================================================================
; Manhunt Achievements - Manhunt (PC)
; ============================================================================
; README_RU_ENG.txt: help in player package / инструкция в игровом комплекте.
; Restart after edits; do not rename keys.
; После правки перезапустите игру; ключи не переименовывать.
; 1 = on / вкл.; 0 = off / выкл.; decimal point / дроби с точкой.

; ============================================================================
; Main settings / Основные настройки
; ============================================================================
[Achievements]

; Mod language / Язык мода
; auto = game / MHLL; ru / en = manual. / auto = игра / MHLL; ru / en = вручную.
; Also de/fr/es/it; legacy 0..6 supported. / Также de/fr/es/it; старые 0..6 работают.
Language=auto

; Enable the mod / Включить мод
Enabled=1

; Unlock notification sound / Звук открытия достижения
Sound=1

; Allow achievements with cheats / Достижения при использовании читов
; 1 = PS4 rules; 0 = no cheats. / 1 = правила PS4; 0 = без читов.
AllowWithCheats=1

; ============================================================================
; Translations / Переводы
; ============================================================================
; External translations for automatic language / Внешние переводы для автоязыка
; UTF-8 + Match; .example is not loaded. / UTF-8 + Match; .example не загружается.
TranslationFiles=data\ManhuntAchievements\lang\*.txt

; ============================================================================
; Diagnostics / Диагностика
; ============================================================================
; Diagnostic log / Диагностический журнал
; 0 = off; 1 = kills/scenes; 2 = detailed. / 0 = выкл.; 1 = убийства/сцены; 2 = подробно.
; Log beside ASI; restore 0 when done. / Журнал рядом с ASI; после проверки верните 0.
Log=0
