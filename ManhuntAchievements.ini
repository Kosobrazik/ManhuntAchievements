; Manhunt Achievements 2.0.0
[Achievements]
Enabled=1
Sound=1
; 0 = detect game language, 1 = English, 2 = Russian (requires Russian game font)
Language=0
; The PS4 trophy script has no cheat handling at all: cheats never block a
; trophy there. 0 makes the plugin stricter than the original. The rabbit and
; monkey skins count either way once their episode pair is finished with five
; stars, which is how the game itself unlocks those cheats.
AllowWithCheats=1
; Diagnostic log next to the ASI. 0 = off, 1 = kills and scenes,
; 2 = full detail for one troubleshooting run (very chatty).
Log=0
